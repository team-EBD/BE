services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eatlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eatlog}
      POSTGRES_DB: ${POSTGRES_DB:-eatlog}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eatlog}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 컨테이너 간 통신은 host=db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-eatlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eatlog}
      POSTGRES_DB: ${POSTGRES_DB:-eatlog}
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
