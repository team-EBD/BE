# cloudtype 배포 스펙 (.github/workflows/deploy.yml 이 참조)
#
# ⚠️ 이 파일은 배포 시 cloudtype 앱 설정을 "덮어쓴다".
#    아래 값은 현재 운영 앱의 설정을 그대로 옮겨 적은 것이 아니라 기본 골격이다.
#    GitHub 저장소 변수 CLOUDTYPE_PROJECT 를 설정해 자동배포를 켜기 전에,
#    cloudtype 대시보드의 현재 앱 설정(포트·시작 명령·환경변수)과 대조해
#    아래 내용을 맞춰야 한다. 대조 없이 켜면 기존 설정이 날아갈 수 있다.
#
# 참고: 시작 명령이 무엇이든(uvicorn 직접 실행 포함) 앱이 기동하며 스스로
#       alembic upgrade head 를 적용한다 (app/core/migrations.py).
#       Dockerfile 로 배포한다면 CMD(sh scripts/start.sh)가 그대로 쓰인다.

name: eatlog-api # TODO: cloudtype 앱 이름으로 교체
app: python@3.12

options:
  ports: 8000
  # 시작 명령. 마이그레이션까지 한 번에 하려면 scripts/start.sh 를 쓴다.
  start: sh scripts/start.sh
  install: pip install -r requirements.txt
  env:
    - name: APP_ENV
      value: production
    # DB·시크릿 등 나머지 환경변수는 대시보드에 설정된 값을 여기에 그대로 옮겨 적어야
    # 배포 시 유실되지 않는다. (현재는 리포에 커밋된 .env 가 컨테이너에 함께 들어간다)

context:
  git:
    url: git@github.com:team-EBD/BE.git
    ref: refs/heads/dev
