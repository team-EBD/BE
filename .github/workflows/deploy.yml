name: Test & Deploy

# dev 에 푸시(=PR 머지 포함)되면 pytest 를 돌리고, 통과하면 AWS EC2 에 배포한다 (deploy-aws 잡).
#
# 🚨 cloudtype 배포는 2026-09-05 부터 **수동 실행(workflow_dispatch)에서만** 일어난다.
#    이유: 아래 배포 스펙이 cloudtype 앱 설정을 통째로 덮어쓰는데, 2026-08-27 AWS
#    컷오버(SCRUM-248)로 cloudtype BE 는 대시보드에서 **RDS** 를 바라보도록 바뀌었다.
#    그런데 이 스펙에는 아직 옛 cloudtype Postgres 주소가 박혀 있어, dev 에 푸시할
#    때마다 운영 DB 연결이 조용히 되돌아간다. 직전 배포가 08-12(컷오버 이전)라
#    09-05 배포에서 처음 드러났다 (SCRUM-256).
#
#    다시 자동 배포로 되돌리려면: 아래 POSTGRES_* 를 RDS 값으로 고치고(호스트/포트/
#    유저/DB 는 시크릿 또는 저장소 변수로) `if` 조건에서 workflow_dispatch 제한을 빼면 된다.
#    cloudtype 을 폐기한다면 이 워크플로째로 지우는 편이 낫다.
#
# 스키마 변경은 기동 시 app/core/migrations.py 가 alembic upgrade head 를 적용하므로
# 이 워크플로에서 따로 마이그레이션을 돌리지 않는다.
#
# ⚠️ deploy 잡은 저장소 변수 CLOUDTYPE_PROJECT 가 설정돼야만 실행된다.
on:
  push:
    branches: [dev]
  workflow_dispatch: # 수동 재배포용

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        # 테스트는 SQLite in-memory 로 돌아 운영 DB 를 건드리지 않는다 (tests/conftest.py)
        run: python -m pytest -q

  deploy-aws:
    name: AWS EC2 deploy (SSM Run Command)
    needs: test
    # dev 에 푸시(=PR 머지)되고 pytest 가 통과하면 AWS EC2(eatlog-app)에 배포한다 (2026-09-06~).
    # 방식: GitHub OIDC 로 IAM 역할 eatlog-github-deploy 를 빌려 SSM 문서 eatlog-deploy 를
    #   보내고, EC2 가 ~/eatlog/deploy_service.sh 로 체크아웃→Parameter Store env 갱신→빌드→재기동
    #   →헬스체크를 수행한다. 액세스 키·SSH 키를 GitHub 에 두지 않는다.
    # 환경변수는 Parameter Store(/eatlog/be/*)가 정본 — 이 워크플로에 값을 적지 않는다.
    # 롤백: AWS 콘솔 Systems Manager → Run Command → eatlog-deploy 에 이전 sha 를 ref 로 실행.
    # Innovation Sandbox 만료 등으로 AWS 쪽이 사라지면 이 잡만 실패하고 test 는 영향 없다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC 토큰 발급 (AssumeRoleWithWebIdentity)
      contents: read
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: i-0d96d7d601622339d
      SERVICE: be
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::779403607744:role/eatlog-github-deploy
          aws-region: ap-northeast-2
      - name: Send deploy command
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" --document-name eatlog-deploy \
            --parameters "service=$SERVICE,ref=${{ github.sha }}" \
            --comment "GitHub ${{ github.repository }}@${{ github.sha }}" \
            --query Command.CommandId --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "command: $CMD_ID"
      - name: Wait for result
        run: |
          CMD_ID="${{ steps.send.outputs.cmd_id }}"
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          echo "status: $STATUS"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          [ "$STATUS" = Success ]

  deploy:
    name: cloudtype deploy
    needs: test
    runs-on: ubuntu-latest
    # 수동 실행에서만 배포한다 (파일 상단 🚨 참고 — 스펙이 운영 DB 설정을 되돌린다).
    # 변수 미설정 = 아직 연동 안 함 → 배포를 건너뛴다 (기존 앱 설정 보호)
    if: github.event_name == 'workflow_dispatch' && vars.CLOUDTYPE_PROJECT != ''
    steps:
      - uses: actions/checkout@v4
      - name: Connect repository to cloudtype
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          # 기본 GITHUB_TOKEN 은 배포키(admin:public_key) 권한이 없어 connect 가 실패한다.
          # repo·workflow·admin:public_key 스코프의 PAT(classic)를 GHP_TOKEN 시크릿으로 넣는다.
          ghtoken: ${{ secrets.GHP_TOKEN }}
      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          # 형식: <스페이스>/<프로젝트> (예: 741u741/ebd-back)
          project: ${{ vars.CLOUDTYPE_PROJECT }}
          stage: ${{ vars.CLOUDTYPE_STAGE }}
          # 배포 스펙은 cloudtype 대시보드 서비스의 'CLI' 탭 내용을 옮긴 것이다.
          # 이 스펙이 앱 설정을 통째로 덮어쓰므로, 대시보드에서 환경변수를 바꾸면
          # 여기에도 반영해야 다음 배포에서 되돌아가지 않는다.
          #
          # 시크릿(DB 비밀번호·JWT 서명키·Firebase 개인키·SMTP 비밀번호)은 스펙에 적지 않고
          # GitHub Secrets 에서 주입한다 — 리포에 평문으로 남기지 않기 위해서다.
          yaml: |
            name: ebd-back
            app: python@3.12
            options:
              ports: "8000"
              start: uvicorn app.main:app --host 0.0.0.0
              env:
                - name: APP_ENV
                  value: local
                - name: API_V1_PREFIX
                  value: /v1
                # 🚨 옛 cloudtype Postgres 주소. 2026-08-27 컷오버 이후 운영 DB 는
                #    AWS RDS 다 — 이 값을 그대로 배포하면 cloudtype BE 가 RDS 에서
                #    떨어져 나가 "두 프론트, 한 DB" 가 깨진다. 고치기 전까지 자동 배포
                #    금지(파일 상단 참고). RDS 값을 아는 사람이 여기를 갱신할 것.
                - name: POSTGRES_HOST
                  value: svc.sel3.cloudtype.app
                - name: POSTGRES_PORT
                  value: "31750"
                - name: POSTGRES_USER
                  value: root
                - name: POSTGRES_PASSWORD
                  value: ${{ secrets.POSTGRES_PASSWORD }}
                - name: POSTGRES_DB
                  value: postgres
                - name: JWT_SECRET
                  value: ${{ secrets.JWT_SECRET }}
                - name: JWT_ALGORITHM
                  value: HS256
                - name: ACCESS_TOKEN_EXPIRE_MINUTES
                  value: "30"
                - name: REFRESH_TOKEN_EXPIRE_DAYS
                  value: "14"
                - name: GOOGLE_CLIENT_ID
                  value: 360715778329-sv6pvfll0ga9ruhc542tbb3l4dd38fuv.apps.googleusercontent.com
                - name: AI_SERVER_BASE_URL
                  value: https://port-0-ebd-ai-mrfrqw875d990c1a.sel3.cloudtype.app
                - name: AI_REQUEST_TIMEOUT_SECONDS
                  value: "60"
                - name: AI_CLIENT_MODE
                  value: real
                # AI 서버 /internal/* 인증. AI 쪽 INTERNAL_TOKEN 과 **같은 값**이어야
                # 하며, 다르거나 비면 AI 가 401 을 준다 (2026-08-01 추천 502 사고).
                # 두 레포의 GitHub Secrets 에 같은 값을 넣어 둔다.
                - name: INTERNAL_TOKEN
                  value: ${{ secrets.INTERNAL_TOKEN }}
                - name: STORAGE_DIR
                  value: ./uploads
                - name: STORAGE_BASE_URL
                  value: http://localhost:8000/static
                - name: STORAGE_BACKEND
                  value: firebase
                - name: FIREBASE_STORAGE_BUCKET
                  value: soma-temp-storage.firebasestorage.app
                - name: FIREBASE_CREDENTIALS_JSON
                  value: '${{ secrets.FIREBASE_CREDENTIALS_JSON }}'
                # 푸시 발송 백엔드. 기본값이 mock(로그만 찍고 실제 발송 안 함)이라
                # 명시하지 않으면 주간 리포트 푸시가 조용히 나가지 않는다.
                # 자격증명은 위 FIREBASE_CREDENTIALS_JSON 을 재사용한다
                # (스토리지와 같은 서비스 계정 — push_client/__init__.py).
                - name: PUSH_BACKEND
                  value: fcm
                - name: EMAIL_BACKEND
                  value: smtp
                - name: SMTP_USER
                  value: eatlog.service@gmail.com
                - name: SMTP_PASSWORD
                  value: ${{ secrets.SMTP_PASSWORD }}
                # 인앱 결제(구독). store = 스토어 API 로 실제 영수증을 검증한다.
                # 기본값 mock 은 **어떤 토큰이든 프리미엄으로 인정**하므로 운영에서
                # 절대 쓰면 안 된다 — 자격증명 시크릿이 아직 없으면 검증이 503 으로
                # 실패할 뿐, 무료로 프리미엄이 열리지는 않는다(안전한 실패).
                - name: BILLING_BACKEND
                  value: store
                - name: SUBSCRIPTION_PRODUCT_IDS
                  value: eatlog_premium_monthly,eatlog_premium_yearly
                - name: GOOGLE_PLAY_PACKAGE_NAME
                  value: com.eatlog
                # Play Console 에 연결한 서비스 계정 JSON (androidpublisher 권한).
                # Firebase 서비스 계정과 다른 계정이다 — 재사용 금지.
                - name: GOOGLE_PLAY_CREDENTIALS_JSON
                  value: '${{ secrets.GOOGLE_PLAY_CREDENTIALS_JSON }}'
                - name: GOOGLE_PLAY_RTDN_SECRET
                  value: ${{ secrets.GOOGLE_PLAY_RTDN_SECRET }}
                - name: APP_STORE_ISSUER_ID
                  value: ${{ secrets.APP_STORE_ISSUER_ID }}
                - name: APP_STORE_KEY_ID
                  value: ${{ secrets.APP_STORE_KEY_ID }}
                # .p8 내용. 개행은 이스케이프(백슬래시 n)해 한 줄로 넣는다.
                - name: APP_STORE_PRIVATE_KEY
                  value: '${{ secrets.APP_STORE_PRIVATE_KEY }}'
                - name: APP_STORE_BUNDLE_ID
                  value: com.eatlog
                - name: APP_STORE_NOTIFICATION_SECRET
                  value: ${{ secrets.APP_STORE_NOTIFICATION_SECRET }}
              buildenv: []
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: ${{ github.ref }}
